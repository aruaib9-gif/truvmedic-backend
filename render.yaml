# Render Blueprint — deploys the TRUV Medical stack as three linked resources:
#   truvmedic-db   PostgreSQL database
#   truvmedic-api  Express API (server/)
#   truvmedic-web  React static site (repo root)
#
# Create it from the Render dashboard: New → Blueprint → pick this repository.

databases:
  - name: truvmedic-db
    databaseName: truvmedic
    user: truvmedic
    plan: basic_256mb
    region: frankfurt

services:
  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  - type: web
    name: truvmedic-api
    runtime: node
    plan: starter
    rootDir: server
    region: frankfurt
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: truvmedic-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Public URL of the frontend — used for invite/reset links and CORS.
      - key: APP_URL
        fromService:
          type: web
          name: truvmedic-web
          property: host
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: truvmedic-web
          property: host

      # Grants the admin role to these addresses on first registration.
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false

      # Set these in the Render dashboard — they are secrets, never in git.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: EMAIL_FROM
        value: TRUV Medical <noreply@truvmedic.com>
      - key: NOTIFY_EMAIL
        value: info@truvmedic.com
      - key: SUPPORT_EMAIL
        value: info@truvmedic.com
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: truvmedic-web
    runtime: static
    region: frankfurt
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: truvmedic-api
          property: host
    routes:
      # Single-page app: every unmatched path serves index.html so client-side
      # routing (/admin, /careers, /accept-invite, …) survives a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
